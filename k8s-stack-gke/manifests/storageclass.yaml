# pd-standard (HDD) so it does NOT use your small SSD quota.
# Volume expansion + the topolvm annotation let pvc-autoresizer grow PVCs.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: standard-autoresize
  annotations:
    resize.topolvm.io/enabled: "true"
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-standard
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete

# Third oauth2-proxy: Dex login in front of Gatekeeper Policy Manager
config:
  clientID: oauth2-proxy
  clientSecret: oauth2-proxy-dex-secret
  configFile: |-
    provider = "oidc"
    provider_display_name = "Dex"
    oidc_issuer_url = "http://dex.__DOMAIN__/dex"
    redirect_url = "http://gpm.__DOMAIN__/oauth2/callback"
    upstreams = [ "http://gatekeeper-policy-manager.gatekeeper-system.svc:80" ]
    email_domains = [ "*" ]
    scope = "openid email profile"
    cookie_secure = false
    cookie_name = "_oauth2_proxy_gpm"
    skip_provider_button = true

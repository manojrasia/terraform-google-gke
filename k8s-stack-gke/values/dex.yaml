config:
  issuer: http://dex.__DOMAIN__/dex
  storage:
    type: memory
  enablePasswordDB: true
  staticPasswords:
    - email: admin@example.com
      # bcrypt hash of "password" - CHANGE THIS for anything beyond a lab
      hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
      username: admin
      userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
  staticClients:
    - id: argocd
      name: Argo CD
      secret: argocd-dex-secret
      redirectURIs:
        - http://argocd.__DOMAIN__/auth/callback
    - id: oauth2-proxy
      name: oauth2-proxy
      secret: oauth2-proxy-dex-secret
      redirectURIs:
        - http://prometheus.__DOMAIN__/oauth2/callback
        - http://alertmanager.__DOMAIN__/oauth2/callback
        - http://gpm.__DOMAIN__/oauth2/callback
service:
  ports:
    http:
      port: 80

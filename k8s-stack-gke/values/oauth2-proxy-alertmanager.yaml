# Second oauth2-proxy: Dex login in front of Alertmanager
config:
  clientID: oauth2-proxy
  clientSecret: oauth2-proxy-dex-secret
  # cookieSecret is generated by install.sh
  configFile: |-
    provider = "oidc"
    provider_display_name = "Dex"
    oidc_issuer_url = "http://dex.__DOMAIN__/dex"
    redirect_url = "http://alertmanager.__DOMAIN__/oauth2/callback"
    upstreams = [ "http://prometheus-alertmanager.monitoring.svc:9093" ]
    email_domains = [ "*" ]
    scope = "openid email profile"
    cookie_secure = false
    cookie_name = "_oauth2_proxy_am"
    skip_provider_button = true

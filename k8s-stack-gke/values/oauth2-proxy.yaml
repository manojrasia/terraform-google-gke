config:
  clientID: oauth2-proxy
  clientSecret: oauth2-proxy-dex-secret
  # cookieSecret is generated by install.sh
  configFile: |-
    provider = "oidc"
    provider_display_name = "Dex"
    oidc_issuer_url = "http://dex.__DOMAIN__/dex"
    redirect_url = "http://prometheus.__DOMAIN__/oauth2/callback"
    upstreams = [ "http://prometheus-prometheus.monitoring.svc:9090" ]
    email_domains = [ "*" ]
    scope = "openid email profile"
    cookie_secure = false
    skip_provider_button = true

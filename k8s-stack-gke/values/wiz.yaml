# Wiz Kubernetes Integration: Connector + Sensor + Admission Controller.
# No credentials are stored here; install.sh reads them from environment variables.
global:
  clusterDisplayName: __CLUSTER_NAME__
  clusterTags:
    environment: gke
    project: __PROJECT_ID__

# 1) Connector: Wiz scans the cluster's config through an outbound tunnel (Broker).
#    The private cluster reaches Wiz through Cloud NAT.
wiz-kubernetes-connector:
  enabled: true
  autoCreateConnector:
    connectorName: __CLUSTER_NAME__
    clusterFlavor: GKE
  wiz-broker:
    enabled: true

# 2) Sensor: runtime threat detection, one pod per node (DaemonSet)
#    The image pull username/password come from WIZ_SENSOR_PULL_USER / _PASSWORD.
wiz-sensor:
  enabled: true
  sensorClusterName: __CLUSTER_NAME__

# 3) Admission Controller: checks new workloads against your Wiz policies.
#    Its webhook already uses port 10250, which the private-GKE firewall allows.
#    AUDIT = report violations to Wiz but never block.
wiz-admission-controller:
  enabled: true
  webhook:
    policyEnforcementMethod: AUDIT

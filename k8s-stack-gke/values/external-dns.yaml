# Publishes every HTTPRoute hostname into the private Cloud DNS zone
# (created by terraform/stack.tf). Auth is via Workload Identity - no keys.
provider:
  name: google
sources:
  - gateway-httproute
domainFilters:
  - __DOMAIN__
extraArgs:
  - --google-project=__PROJECT_ID__
  - --google-zone-visibility=private
policy: sync
registry: txt
txtOwnerId: __CLUSTER_NAME__
serviceAccount:
  name: external-dns
  annotations:
    iam.gke.io/gcp-service-account: external-dns@__PROJECT_ID__.iam.gserviceaccount.com
logLevel: info

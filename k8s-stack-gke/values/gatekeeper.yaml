replicas: 3                      # gatekeeper-controller-manager 3/3
controllerManager:
  exemptNamespaces:
    - kube-system
    - gmp-system
    - gmp-public
  # GKE-managed namespaces (gke-managed-*, gke-gmp-system, ...)
  exemptNamespacePrefixes:
    - gke-
audit:
  replicas: 1                    # gatekeeper-audit 1/1
  auditInterval: 60

# Names: prometheus-operator, prometheus-prometheus, prometheus-alertmanager
fullnameOverride: prometheus
kube-state-metrics:
  fullnameOverride: kube-state-metrics
prometheus-node-exporter:
  fullnameOverride: node-exporter

grafana:
  adminPassword: admin123        # CHANGE THIS

prometheus:
  prometheusSpec:
    replicas: 2
    retention: 15d
    # Pick up ServiceMonitors and rules from every chart, not just this one
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        metadata:
          annotations:
            # pvc-autoresizer grows the disk when < 20% free, up to 100Gi
            resize.topolvm.io/storage_limit: 100Gi
            resize.topolvm.io/threshold: "20%"
        spec:
          storageClassName: standard-autoresize
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 2
    externalUrl: http://alertmanager.__DOMAIN__
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-autoresize
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "null"
      routes:
        # Watchdog always fires; it proves the alert pipeline works
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
    receivers:
      - name: "null"
      # Example: send alerts to Slack. Uncomment, add your webhook URL,
      # and change route.receiver above to "slack".
      # - name: "slack"
      #   slack_configs:
      #     - api_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
      #       channel: "#alerts"
      #       send_resolved: true
    inhibit_rules:
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity =~ "warning|info"']
        equal: ["namespace", "alertname"]

# ---- GKE specifics ----
# Control plane is managed by Google and not scrapable: disable to avoid
# permanent TargetDown / KubeSchedulerDown alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
# Dataplane V2 (eBPF) replaces kube-proxy
kubeProxy:
  enabled: false
# GKE uses kube-dns, not CoreDNS
coreDns:
  enabled: false
kubeDns:
  enabled: true

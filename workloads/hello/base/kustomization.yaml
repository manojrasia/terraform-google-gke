apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: hello
    includeSelectors: true
resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - httproute.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
configMapGenerator:
  - name: hello-nginx-status      # hash suffix -> pods restart when the config changes
    files:
      - status.conf=nginx-status.conf

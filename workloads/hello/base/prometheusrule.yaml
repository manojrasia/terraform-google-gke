apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hello
spec:
  groups:
    - name: hello
      rules:
        - alert: HelloDown
          expr: sum(nginx_up{namespace="hello"}) == 0 or absent(nginx_up{namespace="hello"})
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "hello: no nginx instance is up"
        - alert: HelloHighErrorRate
          expr: |
            sum(rate(envoy_cluster_upstream_rq{envoy_cluster_name=~"httproute/hello/hello/.*", envoy_response_code=~"5.."}[5m]))
              / sum(rate(envoy_cluster_upstream_rq{envoy_cluster_name=~"httproute/hello/hello/.*"}[5m])) > 0.05
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "hello: more than 5% of requests return 5xx"

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
  hostnames:
    - hello.example.internal   # replaced by Argo CD with hello.<cluster domain>
  rules:
    - backendRefs:
        - name: hello
          port: 80

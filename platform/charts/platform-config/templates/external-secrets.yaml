{{- $c := .Values.cluster.name }}
{{- define "es.header" -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .ns }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
{{- end }}
---
{{ include "es.header" (dict "name" "dex-secrets" "ns" "auth") }}
  target:
    name: dex-secrets
  data:
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef: { key: {{ $c }}-dex-github-client-secret }
    - secretKey: ARGOCD_CLIENT_SECRET
      remoteRef: { key: {{ $c }}-dex-argocd-client-secret }
    - secretKey: GRAFANA_CLIENT_SECRET
      remoteRef: { key: {{ $c }}-dex-grafana-client-secret }
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef: { key: {{ $c }}-dex-oauth2-proxy-client-secret }
---
{{ include "es.header" (dict "name" "oauth2-proxy" "ns" "auth") }}
  target:
    name: oauth2-proxy
    template:
      data:
        client-id: oauth2-proxy
        client-secret: "{{ "{{" }} .clientSecret {{ "}}" }}"
        cookie-secret: "{{ "{{" }} .cookieSecret {{ "}}" }}"
  data:
    - secretKey: clientSecret
      remoteRef: { key: {{ $c }}-dex-oauth2-proxy-client-secret }
    - secretKey: cookieSecret
      remoteRef: { key: {{ $c }}-oauth2-proxy-cookie-secret }
---
{{ include "es.header" (dict "name" "argocd-oidc" "ns" "argocd") }}
  target:
    name: argocd-oidc
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd   # lets argocd-cm reference $argocd-oidc:clientSecret
  data:
    - secretKey: clientSecret
      remoteRef: { key: {{ $c }}-dex-argocd-client-secret }
---
{{ include "es.header" (dict "name" "grafana-secrets" "ns" "monitoring") }}
  target:
    name: grafana-secrets
    template:
      data:
        admin-user: admin
        admin-password: "{{ "{{" }} .adminPassword {{ "}}" }}"
        oauth-client-secret: "{{ "{{" }} .oauthClientSecret {{ "}}" }}"
  data:
    - secretKey: adminPassword
      remoteRef: { key: {{ $c }}-grafana-admin-password }
    - secretKey: oauthClientSecret
      remoteRef: { key: {{ $c }}-dex-grafana-client-secret }
{{- if .Values.alerting.slack.enabled }}
---
{{ include "es.header" (dict "name" "alertmanager-slack" "ns" "monitoring") }}
  target:
    name: alertmanager-slack
  data:
    - secretKey: url
      remoteRef: { key: {{ $c }}-alertmanager-slack-webhook }
{{- end }}
{{- if .Values.wiz.enabled }}
---
{{ include "es.header" (dict "name" "wiz-api-token" "ns" "wiz") }}
  target:
    name: wiz-api-token
  data:
    - secretKey: clientId
      remoteRef: { key: {{ $c }}-wiz-client-id }
    - secretKey: clientToken
      remoteRef: { key: {{ $c }}-wiz-client-token }
{{- end }}

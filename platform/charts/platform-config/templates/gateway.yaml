{{- $public := eq .Values.ingress.exposure "public" }}
# Single shared Gateway. ingress.exposure (set in Terraform) picks the load balancer:
#   internal -> GCP internal passthrough LB (VPC only)
#   public   -> GCP external passthrough LB on the reserved static IP, limited to sourceRanges
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: gateway-lb
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { memory: 512Mi }
      envoyPDB:
        minAvailable: 1
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local    # keep client source IPs
        {{- if $public }}
        loadBalancerIP: {{ required "ingress.publicIP is required for public exposure" .Values.ingress.publicIP }}
        loadBalancerSourceRanges:
          {{- toYaml (required "ingress.sourceRanges is required for public exposure" .Values.ingress.sourceRanges) | nindent 10 }}
        annotations:
          cloud.google.com/l4-rbs: "enabled"   # backend-service based external passthrough LB
        {{- else }}
        annotations:
          networking.gke.io/load-balancer-type: "Internal"
          networking.gke.io/internal-load-balancer-allow-global-access: "true"
        {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: gateway-lb
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: envoy-gateway-system
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.{{ required "cluster.domain is required" .Values.cluster.domain }}"
      allowedRoutes:
        namespaces:
          from: All

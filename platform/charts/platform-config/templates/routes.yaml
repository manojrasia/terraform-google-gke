{{- $d := .Values.cluster.domain }}
{{- $routes := list
  (dict "host" "dex"          "ns" "auth"       "svc" "dex"                           "port" 80)
  (dict "host" "argocd"       "ns" "argocd"     "svc" "argocd-server"                 "port" 80)
  (dict "host" "grafana"      "ns" "monitoring" "svc" "kube-prometheus-stack-grafana" "port" 80)
  (dict "host" "prometheus"   "ns" "auth"       "svc" "oauth2-proxy-prometheus"       "port" 80)
  (dict "host" "alertmanager" "ns" "auth"       "svc" "oauth2-proxy-alertmanager"     "port" 80)
  (dict "host" "gpm"          "ns" "auth"       "svc" "oauth2-proxy-gpm"              "port" 80) }}
{{- range $routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .host }}
  namespace: {{ .ns }}
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
  hostnames:
    - {{ .host }}.{{ $d }}
  rules:
    - backendRefs:
        - name: {{ .svc }}
          port: {{ .port }}
{{- end }}

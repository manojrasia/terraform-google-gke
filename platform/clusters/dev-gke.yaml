# Per-cluster settings for the platform. File name = cluster name.
# Values here must match live/dev/main.tf.
#
# NOT here on purpose: the domain, public/internal exposure and IPs. They come from
# Terraform (output platform_values) and are put on the root app by
# scripts/bootstrap-argocd.sh, so the switch lives in exactly one place.
cluster:
  name: dev-gke
  projectId: boreal-conquest-421512
  region: asia-south1
  environment: dev                 # selects workloads/*/overlays/dev

auth:
  github:
    # GitHub -> Settings -> Developer settings -> OAuth Apps -> New OAuth App
    # Use the URLs from:  terraform -chdir=live/dev output github_oauth_app
    # (they change only if you switch ingress_exposure or the domain)
    # Put the Client ID here and the Client secret in Secret Manager:
    #   printf '%s' 'SECRET' | gcloud secrets versions add dev-gke-dex-github-client-secret --data-file=-
    clientID: "Ov23ctwl58REIksAsOeb"
    orgs: []                       # e.g. [my-company] to allow only org members
  # Emails exactly as GitHub reports them (your primary, verified GitHub email)
  admins:
    - manoj1chaurasia2@gmail.com
  viewers: []

alerting:
  slack:
    enabled: false                 # also set enable_slack_alerts = true in Terraform
    channel: "#alerts"

policies:
  enforcementAction: dryrun        # switch to deny once Gatekeeper audit shows no violations

addons:
  wiz:
    enabled: false                 # also set enable_wiz = true in Terraform
    sensor: false

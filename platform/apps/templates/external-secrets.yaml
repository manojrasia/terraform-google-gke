{{- if .Values.addons.externalSecrets.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- include "platform.meta" (dict "name" "external-secrets" "wave" 0) | nindent 2 }}
spec:
  project: platform
  destination:
    {{- include "platform.destination" "external-secrets" | nindent 4 }}
  syncPolicy:
    {{- include "platform.syncPolicy" . | nindent 4 }}
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: {{ .Values.addons.externalSecrets.version }}
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/platform/values/external-secrets.yaml
        valuesObject:
          serviceAccount:
            name: external-secrets
            annotations:
              iam.gke.io/gcp-service-account: {{ .Values.cluster.name }}-eso@{{ .Values.cluster.projectId }}.iam.gserviceaccount.com
    {{- include "platform.valuesSource" . | nindent 4 }}
{{- end }}

{{- if .Values.workloads.enabled }}
# Every folder workloads/<app>/overlays/<environment> becomes an Application
# in namespace <app>, in the restricted "workloads" project.
# An HTTPRoute named <app> automatically gets the hostname <app>.<cluster domain>,
# so apps never hard-code a domain (it differs between internal and public mode).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ .Values.repoURL }}
        revision: {{ .Values.targetRevision }}
        directories:
          - path: workloads/*/overlays/{{ .Values.cluster.environment }}
  template:
    metadata:
      name: '{{`{{ index .path.segments 1 }}`}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: workloads
      source:
        repoURL: {{ .Values.repoURL }}
        targetRevision: {{ .Values.targetRevision }}
        path: '{{`{{ .path.path }}`}}'
        kustomize:
          patches:
            - target:
                kind: HTTPRoute
                name: '{{`{{ index .path.segments 1 }}`}}'
              patch: |-
                - op: replace
                  path: /spec/hostnames
                  value: ['{{`{{ index .path.segments 1 }}`}}.{{ .Values.cluster.domain }}']
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{`{{ index .path.segments 1 }}`}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            owner: '{{`{{ index .path.segments 1 }}`}}'
        retry:
          limit: -1
          backoff:
            duration: 20s
            factor: 2
            maxDuration: 3m
{{- end }}

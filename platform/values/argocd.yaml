# Used by BOTH the one-time bootstrap (helm) and the self-managed "argocd" Application.
# Cluster-specific settings (URL, SSO, RBAC, ServiceMonitors) are added by platform/apps.
global:
  logging:
    format: json

configs:
  params:
    server.insecure: true            # TLS terminates nowhere yet (HTTP inside the VPC)
  cm:
    admin.enabled: false             # SSO only; break-glass = kubectl via IAM
    exec.enabled: false
    timeout.reconciliation: 180s
    # NOTE: there is deliberately NO health check for argoproj.io/Application.
    # Without it, sync waves only order creation; they never block on a child app's health.
    # Every child app retries on its own until its dependencies exist (eventual consistency).
    # This is what removes yesterday's deadlocks (root stuck behind platform-config /
    # kube-prometheus-stack) - one slow or broken add-on can no longer stall all the others.
    #
    # An HTTPRoute is Healthy once the Gateway accepts it, even if its backend
    # Service does not exist yet (e.g. Grafana still installing).
    resource.customizations.health.gateway.networking.k8s.io_HTTPRoute: |
      hs = { status = "Progressing", message = "Waiting for the Gateway to accept the route" }
      if obj.status ~= nil and obj.status.parents ~= nil then
        for _, p in ipairs(obj.status.parents) do
          for _, c in ipairs(p.conditions or {}) do
            if c.type == "Accepted" and c.status == "True" then
              hs.status = "Healthy"
              hs.message = "Accepted by gateway"
            elseif c.type == "Accepted" and c.status == "False" then
              hs.status = "Degraded"
              hs.message = c.message
            end
          end
        end
      end
      return hs
    # ExternalSecret: missing remote value (e.g. GitHub secret not added yet) shows as
    # Progressing with the reason, instead of Degraded.
    resource.customizations.health.external-secrets.io_ExternalSecret: |
      hs = { status = "Progressing", message = "Waiting for secret sync" }
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "Ready" and c.status == "True" then
            hs.status = "Healthy"
            hs.message = c.message
          elseif c.type == "Ready" then
            hs.message = c.message or c.reason
          end
        end
      end
      return hs
  rbac:
    policy.default: ""               # no access unless listed in platform/clusters/<cluster>.yaml
    scopes: "[email]"
  repositories:
    envoyproxy-oci:
      name: envoyproxy
      url: docker.io/envoyproxy
      type: helm
      enableOCI: "true"

dex:
  enabled: false                     # the standalone Dex (auth namespace) is used

redis-ha:
  enabled: true                      # HA Redis (3 replicas across zones)

controller:
  replicas: 1
  metrics: { enabled: true }
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { memory: 2Gi }

server:
  replicas: 2
  pdb: { enabled: true, minAvailable: 1 }
  metrics: { enabled: true }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 512Mi }

repoServer:
  replicas: 2
  pdb: { enabled: true, minAvailable: 1 }
  metrics: { enabled: true }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 1Gi }

applicationSet:
  replicas: 2
  pdb: { enabled: true, minAvailable: 1 }
  metrics: { enabled: true }
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { memory: 256Mi }

notifications:
  enabled: true

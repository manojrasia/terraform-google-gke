fullnameOverride: blackbox-exporter
replicas: 2
podDisruptionBudget:
  minAvailable: 1
resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits:   { memory: 64Mi }
serviceMonitor:
  selfMonitor:
    enabled: true
  enabled: true
  defaults:
    module: http_2xx
    interval: 30s
  targets:
    - name: argocd
      url: http://argocd-server.argocd.svc.cluster.local/healthz
    - name: dex
      url: http://dex.auth.svc.cluster.local/dex/healthz
    - name: grafana
      url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local/api/health
